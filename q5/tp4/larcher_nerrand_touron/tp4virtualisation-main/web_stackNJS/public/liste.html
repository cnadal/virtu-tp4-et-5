<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Liste voitures</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
        padding: 40px;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 900px;
        margin: auto;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      #result {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Liste des voitures</h1>

      <button onclick='loadCars()'>Charger</button>

      <div id="liste"></div>
      <div id="result"></div>
    </div>

    <script>
      function loadCars() {
        fetch("http://localhost:8080/listeVoitures.php")
          .then((res) => res.text())
          .then((html) => (document.getElementById("liste").innerHTML = html));
      }
    </script>
  </body>
</html>
