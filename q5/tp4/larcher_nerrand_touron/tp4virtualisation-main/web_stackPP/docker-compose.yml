services:

  web_pp:
    build: .
    container_name: web_pp
    ports:
      - "8083:80"
    env_file:
      - .env
    depends_on:
      - db_postgres
    networks:
      - web_stack

  db_postgres:
    image: postgres:16
    container_name: db_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - web_stack

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8084:80"
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db_postgres
    networks:
      - web_stack


networks:
  web_stack:
    driver: bridge

