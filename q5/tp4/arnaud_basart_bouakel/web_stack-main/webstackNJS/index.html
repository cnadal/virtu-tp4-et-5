<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Web Stack NJS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
        .product {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-ajax {
            background: #00d4aa;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn-ajax:hover { background: #00b894; transform: translateY(-2px); }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .loading { color: #ffd700; animation: pulse 1.5s infinite; }
        .error { color: #ff6b6b; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
<h1>Garage Web Stack Node.js + PHP</h1>

<h2>Actions Base de Données (AJAX)</h2>
<div style="text-align: center;">
    <button class="btn-ajax" onclick="callCreationBDD()">1️⃣ Créer BDD</button>
    <button class="btn-ajax" onclick="callAjoutVoitures()">2️⃣ Ajouter Voitures</button>
    <button class="btn-ajax" onclick="callListeVoitures()">3️⃣ Liste Voitures</button>
</div>

<div id="result"></div>

<script>
    async function callAjax(url, label) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `<div class="loading">⏳ ${label} en cours...</div>`;

        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const text = await response.text();
            resultDiv.innerHTML = `
                    <div class="result">
                        <h3>${label} réussie !</h3>
                        <pre>${text.substring(0, 1500)}${text.length > 1500 ? '...\n[TRUNCATED]' : ''}</pre>
                    </div>
                `;
        } catch (error) {
            resultDiv.innerHTML = `<div class="error">Erreur ${label}: ${error.message}</div>`;
            console.error('AJAX Error:', error);
        }
    }

    window.callCreationBDD = () => callAjax('http://localhost:3000/web_stackNJS/creationBDD.php', 'Création BDD');
    window.callAjoutVoitures = () => callAjax('http://localhost:3000/web_stackNJS/ajoutVoituresGarage.php', 'Ajout Voitures');
    window.callListeVoitures = () => callAjax('http://localhost:3000/web_stackNJS/listeVoitures.php', 'Liste Voitures');
</script>
</body>
</html>
