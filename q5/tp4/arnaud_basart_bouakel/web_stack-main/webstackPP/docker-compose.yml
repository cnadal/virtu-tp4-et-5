services:
  web_pp:
    build: .
    container_name: web_pp
    ports:
      - "88:80"
    env_file: ./var.env
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db_pg
    networks:
      - web_stackPP

  db_pg:
    image: postgres:17
    container_name: db_pg
    environment:
      POSTGRES_DB: garageM
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - web_stackPP

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "83:80"
    depends_on:
      - db_pg
    networks:
      - web_stackPP

volumes:
  pg_data:

networks:
  web_stackPP:
    driver: bridge