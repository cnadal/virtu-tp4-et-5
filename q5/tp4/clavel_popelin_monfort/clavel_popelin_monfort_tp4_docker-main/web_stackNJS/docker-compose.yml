services:
  web:
    build: .
    container_name: nodejs_full_stack
    ports:
      - "80:3000"
    restart: always
    depends_on:
      - db_postgres

  db_postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: testdb
