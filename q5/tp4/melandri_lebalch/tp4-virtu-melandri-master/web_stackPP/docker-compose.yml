version: '3.8'

# ============================================================
# Stack Docker - web_stackPP
# Apache + PHP 8.2 + PostgreSQL + PgAdmin4
# ============================================================

services:

  # ---- Serveur Web Apache + PHP 8.2 ----
  web_pp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_pp
    ports:
      - "${WEB_PP_PORT}:80"
    volumes:
      - web_pp_data:/var/www/html
    networks:
      - web_stack
    depends_on:
      - db_postgres
    restart: unless-stopped

  # ---- Serveur de base de données PostgreSQL ----
  db_postgres:
    image: postgres:latest
    container_name: db_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_postgres_data:/var/lib/postgresql/data
    networks:
      - web_stack
    restart: unless-stopped

  # ---- PgAdmin4 ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - web_stack
    depends_on:
      - db_postgres
    restart: unless-stopped

# ============================================================
# Réseau
# ============================================================
networks:
  web_stack:
    name: web_stack_MP
    driver: bridge

# ============================================================
# Volumes
# ============================================================
volumes:
  web_pp_data:
    name: web_pp_data
  db_postgres_data:
    name: db_postgres_data
  pgadmin_data:
    name: pgadmin_data