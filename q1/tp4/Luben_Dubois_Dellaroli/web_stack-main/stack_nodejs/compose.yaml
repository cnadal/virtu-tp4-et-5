services:
  nodejs:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - bridge
    
  
  mysql:
    image: mysql:9.2
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 3316:3306
    volumes:
      - ./database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - bridge

  phpmyadmin:
    image: phpmyadmin:apache
    container_name: pma_mysql82
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 82:80
    environment:
      - PMA_HOST=mysql
    networks:
      - bridge


networks:
  bridge:
    driver: bridge