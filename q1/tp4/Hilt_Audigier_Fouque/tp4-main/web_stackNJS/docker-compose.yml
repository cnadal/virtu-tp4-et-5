services:
  web_njs:
    build: 
      context: .
      dockerfile_inline: |
        FROM node:20
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 3000
        CMD ["npm", "start"]
    image: web_stacknjs
    container_name: nodejs_server
    ports:
      - 3001:3000
    env_file:
      - ./njs.env
    networks:
      - web_stack

networks:
  web_stack:
    external: true
    name: web_stackmp_web_stack
