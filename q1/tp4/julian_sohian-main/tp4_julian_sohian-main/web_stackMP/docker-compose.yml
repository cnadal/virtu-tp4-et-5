services:
  web:
    build: ./web
    container_name: web_mp
    ports:
      - "8080:80"
    env_file:
      - ./var.env
    networks:
      - web_stack

  mysql:
    image: mysql:9.2
    container_name: mysql_mp
    env_file:
      - ./var.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web_stack

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_mp
    ports:
      - "8081:80"
    env_file:
      - ./var.env
    networks:
      - web_stack

networks:
  web_stack:
    driver: bridge

volumes:
  db_data: