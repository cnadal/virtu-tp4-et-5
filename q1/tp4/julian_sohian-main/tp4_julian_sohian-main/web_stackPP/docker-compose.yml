services:
  web:
    build: ./web
    container_name: web_mp
    ports:
      - "8080:80"
    volumes:
      - ./web/html:/var/www/html
    networks:
      - web_stack

  postgres:
    image: postgres:latest
    container_name: postgres_pp
    env_file:
      - ./var.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - web_stack

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_pp
    ports:
      - "8082:80"
    env_file:
      - ./var.env
    networks:
      - web_stack

networks:
  web_stack:
    driver: bridge

volumes:
  db_data:
