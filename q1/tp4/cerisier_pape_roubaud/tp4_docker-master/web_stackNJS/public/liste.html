<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Voitures</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc; padding: 40px 20px; margin: 0; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #007bff; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .btn { background: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #117a8b; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 0 5px rgba(0,0,0,0.05); }
        th, td { border: 1px solid #e9ecef; padding: 12px 15px; text-align: left; }
        th { background-color: #f8f9fa; color: #495057; font-weight: bold; }
        tbody tr:hover { background-color: #f1f3f5; }
        
        .loading { font-style: italic; color: #6c757d; text-align: center; padding: 20px; display: none; }
        .error { color: #dc3545; font-weight: bold; text-align: center; padding: 15px; display: none; }
        
        .back-link { display: inline-block; margin-top: 30px; color: #007bff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1>Inventaire du Garage</h1>
            <button class="btn" id="load-btn">🔄 Actualiser la liste</button>
        </div>
        
        <p>Cette page interroge <code>/web_stackNJS/listeVoitures.php</code>.</p>
        
        <div id="loading" class="loading">Chargement des données depuis la base MariaDB...</div>
        <div id="error" class="error"></div>

        <table id="cars-table" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marque</th>
                    <th>Modèle</th>
                    <th>Année</th>
                </tr>
            </thead>
            <tbody>
                <!-- Contenu injecté via AJAX -->
            </tbody>
        </table>
        
        <a href="index.html" class="back-link">← Retour à l'accueil</a>
    </div>

    <script>
        function loadCars() {
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error');
            const table = document.getElementById('cars-table');
            const tbody = table.querySelector('tbody');
            
            loading.style.display = 'block';
            errorBox.style.display = 'none';
            table.style.display = 'none';
            tbody.innerHTML = '';

            fetch('/web_stackNJS/listeVoitures.php')
                .then(res => res.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.success && data.voitures) {
                        if (data.voitures.length === 0) {
                            errorBox.innerText = "La base de données ne contient aucune voiture. N'oubliez pas de les ajouter !";
                            errorBox.style.color = "#856404";
                            errorBox.style.display = 'block';
                        } else {
                            data.voitures.forEach(v => {
                                const row = `<tr>
                                    <td>#${v.id}</td>
                                    <td><strong>${v.marque}</strong></td>
                                    <td>${v.modele}</td>
                                    <td>${v.annee}</td>
                                </tr>`;
                                tbody.innerHTML += row;
                            });
                            table.style.display = 'table';
                        }
                    } else {
                        errorBox.innerText = "Erreur: " + data.error;
                        errorBox.style.display = 'block';
                    }
                })
                .catch(err => {
                    loading.style.display = 'none';
                    errorBox.innerText = "Erreur de connexion au serveur Node.js.";
                    errorBox.style.display = 'block';
                });
        }

        // Charger les données au démarrage
        document.addEventListener('DOMContentLoaded', loadCars);
        document.getElementById('load-btn').addEventListener('click', loadCars);
    </script>
</body>
</html>
