<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajout Voitures</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f7f9fc; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #333; font-size: 1.8rem; margin-top: 0; }
        .btn { background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin: 20px 0; }
        .btn:hover { background: #218838; transform: translateY(-2px); }
        .result { padding: 15px; margin-top: 15px; border-radius: 5px; font-weight: 500; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-link { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Peupler le Garage</h1>
        <p>Cette action va appeler <code>/web_stackNJS/ajoutVoituresGarage.php</code> en méthode POST pour insérer des données de test.</p>
        
        <button class="btn" id="action-btn">Insérer les Voitures</button>
        
        <div id="result-box" class="result"></div>
        
        <br>
        <a href="index.html" class="back-link">← Retour à l'accueil</a>
    </div>

    <script>
        document.getElementById('action-btn').addEventListener('click', () => {
            const btn = document.getElementById('action-btn');
            const resultBox = document.getElementById('result-box');
            
            btn.innerText = "Ajout en cours...";
            btn.disabled = true;

            fetch('/web_stackNJS/ajoutVoituresGarage.php', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    resultBox.style.display = 'block';
                    if (data.success) {
                        resultBox.className = 'result success';
                        resultBox.innerText = "✅ " + data.message;
                    } else {
                        resultBox.className = 'result error';
                        resultBox.innerText = "❌ " + (data.error || "Erreur inconnue");
                    }
                })
                .catch(err => {
                    resultBox.style.display = 'block';
                    resultBox.className = 'result error';
                    resultBox.innerText = "❌ Impossible de joindre le serveur Node.js.";
                })
                .finally(() => {
                    btn.innerText = "Insérer les Voitures";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
