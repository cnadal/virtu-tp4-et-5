services:
  nodejs:
    image: node:trixie
    container_name: web_stackNJS
    working_dir: /var/www/html
    command: bash -c "npm install && node server.js"
    env_file:
      - var.env
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_db_njs
    env_file:
      - var.env
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
