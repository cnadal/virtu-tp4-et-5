worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # --------------------------------------------------------
    # Upstream : application PHP/Apache
    # --------------------------------------------------------
    upstream web_app {
        server web_app:80;
    }

    # --------------------------------------------------------
    # Upstream : Keycloak
    # --------------------------------------------------------
    upstream keycloak {
        server keycloak_auth:8080;
    }

    # --------------------------------------------------------
    # Serveur HTTP principal — tp5.local
    # --------------------------------------------------------
    server {
        listen 80;
        server_name tp5.local localhost;

        # --- Chemins Keycloak (admin, auth, ressources statiques JS) ---
        location ~ ^/(admin|realms|resources|js)/ {
            proxy_pass         http://keycloak;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffer_size        128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size  256k;
        }

        # --- Application web (tout le reste) ---
        location / {
            proxy_pass         http://web_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
