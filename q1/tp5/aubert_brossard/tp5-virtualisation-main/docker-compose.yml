services:
  proxy_nginx:
    image: nginx:latest
    container_name: proxy_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    networks:
      - net_public
    depends_on:
      - web_app

  web_app:
    build: .
    container_name: web_app
    volumes:
      - ./src:/var/www/html
    networks:
      - net_public
      - net_db
    depends_on:
      - mysql_master

  mysql_master:
    image: mysql:9.2
    container_name: mysql_master
    env_file: .env
    volumes:
      - ./mysql/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - master_data:/var/lib/mysql
    networks:
      - net_db

  mysql_slave:
    image: mysql:9.2
    container_name: mysql_slave
    env_file: .env
    volumes:
      - ./mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - slave_data:/var/lib/mysql
    networks:
      - net_db
    depends_on:
      - mysql_master

  postgres_keycloak:
    image: postgres:15
    container_name: postgres_keycloak
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - net_auth

  keycloak_auth:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_auth
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres_keycloak:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - net_public
      - net_auth
    depends_on:
      - postgres_keycloak

  mail_test:
    image: axllent/mailpit
    container_name: mail_test
    ports:
      - "8025:8025"
    networks:
      - net_public

networks:
  net_public:
    driver: bridge
  net_db:
    driver: bridge
  net_auth:
    driver: bridge

volumes:
  master_data:
  slave_data:
  pg_data:
